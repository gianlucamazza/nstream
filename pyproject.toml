[project]
name = "nstream"
description = "Native Stremio-like client: Cinemeta + Torrentio (Real-Debrid) + mpv."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = []

[project.scripts]
nstream = "nstream.cli:_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nstream/__init__.py"

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
root = ["./src"]
